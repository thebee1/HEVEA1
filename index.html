<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEVEA — Gestion des Plantations d'Hévéa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p600:#124b38; --p500:#1b654b; --p400:#70b894; --p100:#dcebe2;
  --dark900:#103d30; --dark800:#164b3b; --dark700:#205f49;
  --ink:#173f34; --muted:#65756d; --line:#d9e3dc; --bg:#f2f5f0;
  --green:#1b7651; --green-light:#e0f0e7;
  --red:#ef4444; --red-light:#fee2e2;
  --amber:#f59e0b; --amber-light:#fef3c7;
  --blue:#3b82f6; --blue-light:#dbeafe;
  --radius:12px; --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow:0 4px 6px -1px rgba(0,0,0,0.1),0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1),0 4px 6px -2px rgba(0,0,0,0.05);
}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

.security-input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);font-size:14px;outline:none;transition:.2s}
.security-input:focus{border-color:var(--p500);box-shadow:0 0 0 3px var(--p100)}

/* ---------- LAYOUT ---------- */
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:260px;background:var(--dark900);color:#e2e8f0;padding:24px 16px;display:flex;flex-direction:column;z-index:60;transition:transform .25s ease;border-right:1px solid var(--dark800)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 28px}
.brand-logo{width:42px;height:42px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;border:1px solid var(--dark700);overflow:hidden}
.brand-logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.brand h1{font-size:20px;letter-spacing:1px;color:#fff;font-weight:700}
.brand small{font-size:11px;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;font-weight:500}
.nav-menu{flex:1;display:flex;flex-direction:column;gap:4px;overflow-y:auto;padding-right:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;color:#94a3b8;cursor:pointer;font-size:14px;font-weight:500;transition:.15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--dark800);color:#fff}
.nav-item.active{background:var(--p600);color:#fff;font-weight:600}
.nav-item svg{flex:none}
.nav-sep{margin:20px 12px 8px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#82a99a;font-weight:600}
.user-widget{margin-top:auto;padding-top:20px;border-top:1px solid var(--dark800)}
.user-info{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;background:var(--dark800);cursor:pointer;transition:.15s}
.user-info:hover{background:var(--dark700)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--p500);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.user-details{flex:1;min-width:0}
.user-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11.5px;color:#94a3b8}

.main{margin-left:260px;flex:1;min-width:0;display:flex;flex-direction:column;background:linear-gradient(rgba(242,245,240,.88),rgba(242,245,240,.88)),url("logo1.jpg") center/cover}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar-left{display:flex;align-items:center;gap:16px;flex:1}
.hamburger{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;width:40px;height:40px;cursor:pointer;align-items:center;justify-content:center;color:var(--dark900)}
.search-wrap{position:relative;flex:1;max-width:420px}
.search-wrap input{width:100%;padding:10px 14px 10px 40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:14px;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--p500);background:#fff;box-shadow:0 0 0 3px var(--p100)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;pointer-events:none}
.search-results{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden;display:none;z-index:50;max-height:300px;overflow-y:auto}
.search-results.show{display:block}
.sr-item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--line);transition:.15s}
.sr-item:last-child{border:none}
.sr-item:hover{background:var(--bg)}
.sr-item .sub{font-size:12px;color:var(--muted);margin-top:2px}
.sr-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

main{padding:32px;max-width:1400px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-head h2{font-size:26px;letter-spacing:-.5px;color:var(--dark900);font-weight:700}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn.primary{background:var(--p600);color:#fff}
.btn.primary:hover{background:var(--p500);transform:translateY(-1px)}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--dark900)}
.btn.ghost:hover{border-color:#cbd5e1;background:var(--bg)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn.danger:hover{background:#dc2626}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:6px}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--muted);padding:6px;border-radius:6px;display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:var(--bg);color:var(--dark900)}

/* ---------- CARDS & STATS ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:28px}
.stat-card{padding:24px;position:relative;background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.stat-card.interactive{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.stat-card.interactive:hover,.stat-card.interactive:focus-visible{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--p400);outline:none}
.stat-card.interactive:focus-visible{box-shadow:0 0 0 3px var(--p100),var(--shadow)}
.stat-card .header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.stat-card .lbl{font-size:13px;color:var(--muted);font-weight:600}
.stat-card .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.stat-card .val{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--dark900);line-height:1}
.stat-card .sub{font-size:12.5px;color:var(--muted);margin-top:8px;font-weight:500}

.stat-card.green .ic{background:var(--green-light);color:var(--green)}
.stat-card.amber .ic{background:var(--amber-light);color:var(--amber)}
.stat-card.red .ic{background:var(--red-light);color:var(--red)}
.stat-card.blue .ic{background:var(--blue-light);color:var(--blue)}

.dashboard-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:24px;margin-bottom:32px}
.dashboard-layout>div{min-width:0}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title h3{font-size:16px;letter-spacing:-.2px;color:var(--dark900);font-weight:700}
.section-title .muted{font-size:13px;color:var(--muted);font-weight:500}

/* ---------- GRAPHIQUE SVG ---------- */
.chart-container{position:relative;height:280px;width:100%;padding:10px 20px 20px;overflow-x:auto;cursor:grab;user-select:none}
.chart-container.dragging{cursor:grabbing}
.chart-svg{width:100%;height:100%;overflow:visible}
.chart-years{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;border-top:1px solid var(--line)}
.chart-year{flex:none}
.chart-year.active{background:var(--p600);border-color:var(--p600);color:#fff}
.chart-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
.chart-line{fill:none;stroke:var(--p600);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#chartGradient)}
.chart-dot{fill:#fff;stroke:var(--p600);stroke-width:2.5;transition:.2s;cursor:pointer}
.chart-dot:hover{r:6;stroke-width:4}
.chart-label{font-size:11px;fill:var(--muted);text-anchor:middle;font-weight:600}
.chart-value{font-size:12px;fill:var(--p600);font-weight:800;text-anchor:middle;opacity:0;transition:.2s;pointer-events:none}
.chart-group:hover .chart-value{opacity:1}

/* ---------- DATA TABLES ---------- */
.table-container{width:100%;overflow-x:auto;background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;text-align:left}
th{background:var(--bg);padding:14px 20px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:16px 20px;border-bottom:1px solid var(--line);font-size:14px;color:var(--dark700);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafc}
.td-main{font-weight:600;color:var(--dark900)}
.td-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.td-amount{font-weight:700;color:var(--dark900)}
.td-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* ---------- PRODUCER GRID ---------- */
.grid-producers{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px}
.p-card{padding:24px;cursor:pointer;transition:.2s;background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.p-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--p400)}
.p-card .top{display:flex;gap:16px;align-items:center}
.p-card .name{font-weight:700;font-size:16px;letter-spacing:-.2px;color:var(--dark900)}
.p-card .meta{font-size:13px;color:var(--muted);margin-top:3px}
.p-card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.p-card .bal{font-size:12.5px;color:var(--muted);font-weight:500}
.p-card .bal b{display:block;font-size:16px;margin-top:3px;font-weight:700}
.bal-ok{color:var(--green)} .bal-due{color:var(--red)}

.avatar{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;overflow:hidden;background:hsl(var(--h,220),60%,55%)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- CHIPS ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--green-light);color:#047857}
.chip.due{background:var(--red-light);color:#b91c1c}
.chip.warn{background:var(--amber-light);color:#b45309}
.chip.info{background:var(--blue-light);color:#1d4ed8}

/* ---------- PROFILE HEADER ---------- */
.profile-header{display:flex;gap:24px;align-items:center;padding:32px;margin-bottom:24px;background:#fff;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow-sm);flex-wrap:wrap}
.profile-header .info{flex:1;min-width:200px}
.profile-header h2{font-size:26px;letter-spacing:-.4px;color:var(--dark900);font-weight:700}
.profile-header .tags{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);color:var(--dark700);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600}
.profile-header .actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- TABS ---------- */
.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto}
.tab{padding:14px 20px;border:none;background:none;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--dark900)}
.tab.active{color:var(--p600);border-bottom-color:var(--p600)}

/* ---------- FORMS & MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:16px;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:pop .2s cubic-bezier(.2,.9,.3,1.2)}
.modal.wide{max-width:800px}
@keyframes pop{from{transform:scale(.95) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:24px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:18px;letter-spacing:-.3px;color:var(--dark900);font-weight:700}
.modal-body{padding:24px;overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:12px;padding:20px 24px;border-top:1px solid var(--line);background:var(--bg);border-radius:0 0 16px 16px}

.field{margin-bottom:20px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--dark700);margin-bottom:8px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;outline:none;transition:.15s;color:var(--dark900)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--p500);box-shadow:0 0 0 3px var(--p100)}
.field input[readonly]{background:var(--bg);color:var(--muted);font-weight:600}
.field input.highlight{background:var(--p100);border-color:var(--p400);color:var(--p600);font-weight:800;font-size:16px}
.field textarea{resize:vertical;min-height:80px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}

/* ---------- FILES ---------- */
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px}
.file-tile{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;position:relative;transition:.15s;box-shadow:var(--shadow-sm)}
.file-tile:hover{border-color:var(--p400);box-shadow:var(--shadow)}
.file-preview{width:min(1100px,96vw);height:min(88vh,900px);max-width:none}
.file-preview .modal-body{display:flex;align-items:center;justify-content:center;min-height:0;background:#f1f5f9}
.file-preview img,.file-preview iframe{width:100%;height:100%;border:0;object-fit:contain;background:#fff}
.file-thumb{height:120px;background:var(--bg);display:grid;place-items:center;overflow:hidden}
.file-thumb img{width:100%;height:100%;object-fit:cover}
.file-thumb svg{opacity:.4}
.file-info{padding:12px 16px;border-top:1px solid var(--line)}
.file-info .fn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dark900)}
.file-info .fs{font-size:11.5px;color:var(--muted);margin-top:4px}
.file-acts{position:absolute;top:8px;right:8px;display:flex;gap:6px;opacity:0;transition:.15s}
.file-tile:hover .file-acts{opacity:1}
.file-acts button{background:#fff;border:1px solid var(--line);border-radius:6px;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow-sm);transition:.15s}
.file-acts button:hover{background:var(--bg);border-color:#cbd5e1}

/* ---------- EMPTY STATE ---------- */
.empty-state{padding:60px 20px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--radius);border:1px solid var(--line)}
.empty-state svg{opacity:.2;margin-bottom:20px}
.empty-state h4{color:var(--dark900);font-size:18px;margin-bottom:8px;font-weight:700}
.empty-state p{font-size:14px;margin-bottom:24px}

/* ---------- TOAST ---------- */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{background:var(--dark900);color:#fff;padding:14px 24px;border-radius:8px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);animation:slideup .3s ease;display:flex;align-items:center;gap:10px;border-left:4px solid var(--p500)}
.toast.err{background:var(--red);border-left-color:#991b1b}
@keyframes slideup{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- RESPONSIVE ---------- */
@media(max-width:1024px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .dashboard-layout{grid-template-columns:1fr}
}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .main{margin-left:0}
  .hamburger{display:flex}
  main{padding:20px 16px 60px}
  .topbar{padding:16px}
  .grid2,.grid3{grid-template-columns:1fr}
  .profile-header{flex-direction:column;text-align:center;align-items:center}
  .stats-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .topbar{padding:10px;gap:8px}
  .topbar-left{gap:8px}
  .topbar>.btn{padding:9px 10px;font-size:12px}
  .search-wrap input{padding:10px 8px 10px 34px;font-size:12px}
  main{padding:16px 10px 48px}
  .page-head h2{font-size:22px}
  .btn{white-space:normal}
  .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-card{padding:14px}
  .stat-card .val{font-size:20px}
  .table-container{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-container table{min-width:720px}
  .card{border-radius:10px}
}
@media print{
  .sidebar,.topbar,.page-head .btn,.toast-wrap{display:none!important}
  .main{margin:0;background:#fff}
  main{max-width:none;padding:0}
  body{background:#fff}
  .card,.stat-card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>

<!-- 🔐 AUTH : le modal #adminLoginOverlay a été SUPPRIMÉ. La connexion se fait sur auth.html. -->

<!-- MODAL DE SÉCURITÉ POUR SUPPRESSION (conservé) -->
<div id="securityOverlay" class="overlay" style="display:none; z-index:10001;">
  <div class="modal" style="max-width:400px;">
    <div class="modal-head"><h3>Sécurité Requise</h3></div>
    <div class="modal-body" style="text-align:center;">
      <div style="font-size:40px;margin-bottom:15px;">🔐</div>
      <p style="font-size:14px;margin-bottom:20px;color:var(--muted);" id="securityMsg">Tapez <b>SUPPRIMER</b> pour confirmer cette action irréversible.</p>
      <input type="text" id="securityPassInput" class="security-input" placeholder="SUPPRIMER" style="margin-bottom:10px;">
      <div id="securityError" style="color:var(--red);font-size:13px;font-weight:600;display:none;">Saisie incorrecte.</div>
    </div>
    <div class="modal-foot" style="justify-content:center;">
      <button class="btn ghost" onclick="document.getElementById('securityOverlay').style.display='none'">Annuler</button>
      <button class="btn danger" id="securityConfirmBtn">Confirmer la suppression</button>
    </div>
  </div>
</div>

<div class="app" id="appContainer">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <img src="logo.jpg" alt="Logo HEVEA">
      </div>
      <div>
        <h1>HEVEA</h1>
        <small>Gestion Plantation</small>
      </div>
    </div>

    <div class="nav-menu">
      <button class="nav-item" data-action="nav" data-view="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Tableau de bord

<script>
/* =========================================================
   🔐 AUTH — CONFIGURATION (DOIT ÊTRE IDENTIQUE À auth.html)
   ========================================================= */
const AUTH_SECRET = 'HEVEA-2024-changez-cette-cle-32-caracteres-min';
const AUTH_PAGE = 'auth.html';

/* =========================================================
   🔐 AUTH — VÉRIFICATION DU TOKEN (HMAC SHA-256)
   ========================================================= */
function b64uDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  return atob(str);
}

async function hmacSign(payloadStr) {
  const key = await crypto.subtle.importKey(
    'raw',
    new TextEncoder().encode(AUTH_SECRET),
    { name: 'HMAC', hash: 'SHA-256' },
    false,
    ['sign']
  );
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(payloadStr));
  return [...new Uint8Array(sig)].map(x => x.toString(16).padStart(2, '0')).join('');
}

async function verifyToken(token) {
  if (!token) return null;
  const parts = token.split('.');
  if (parts.length !== 2) return null;
  const [payloadB64, signature] = parts;
  const expected = await hmacSign(payloadB64);
  if (expected !== signature) return null;
  try {
    const payload = JSON.parse(b64uDecode(payloadB64));
    if (payload.exp < Date.now()) return null;
    return payload;
  } catch {
    return null;
  }
}

async function guardAuth() {
  const token = localStorage.getItem('hevea_token');
  const payload = await verifyToken(token);
  if (!payload) {
    // Pas de session valide → redirection vers auth.html
    const redirect = encodeURIComponent(location.pathname.split('/').pop() || 'index.html');
    location.replace(`${AUTH_PAGE}?redirect=${redirect}`);
    return null;
  }
  return payload;
}

/* =========================================================
   CONFIGURATION MÉTIER
   ========================================================= */
const CREDITOR_INFO_KEY = 'hevea_creditor_info';
let isAdminLoggedIn = false;
let rootDirHandle = null;

function getCreditorInfo() {
  const raw = localStorage.getItem(CREDITOR_INFO_KEY);
  if (!raw) return { name: '', cni: '', address: '', contact: '' };
  try {
    const info = JSON.parse(raw);
    return {
      name: info.name || '',
      cni: info.cni || '',
      address: info.address || '',
      contact: info.contact || ''
    };
  } catch (error) {
    console.error('Informations du créancier invalides dans le stockage local', error);
    return { name: '', cni: '', address: '', contact: '' };
  }
}

/* =========================================================
   🔐 AUTH — Confirmation de suppression (sans serveur)
   Vérifie que la session est toujours active, puis demande
   la saisie du mot "SUPPRIMER".
   ========================================================= */
async function askDeletePassword(callback) {
  const session = await verifyToken(localStorage.getItem('hevea_token'));
  if (!session) {
    toast('Session expirée. Redirection…', true);
    setTimeout(() => location.reload(), 1200);
    return;
  }

  const input = document.getElementById('securityPassInput');
  input.value = '';
  document.getElementById('securityError').style.display = 'none';
  document.getElementById('securityOverlay').style.display = 'flex';

  const btn = document.getElementById('securityConfirmBtn');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.onclick = () => {
    if (input.value.trim().toUpperCase() === 'SUPPRIMER') {
      document.getElementById('securityOverlay').style.display = 'none';
      callback();
    } else {
      document.getElementById('securityError').style.display = 'block';
    }
  };
}

function initApp() {
  if (!window.heveaInitialized) {
    window.heveaInitialized = true;
    (async function() {
      // 🔐 Vérification d'authentification AVANT tout
      const session = await guardAuth();
      if (!session) return; // redirection en cours
      window.heveaSession = session;
      isAdminLoggedIn = session.role === 'admin';

      await FileDB.init();
      // Tente de récupérer le dossier principal
      try {
        const rootRec = await FileDB.get('rootDir');
        if (rootRec && rootRec.handle) {
          rootDirHandle = rootRec.handle;
          const perm = await rootDirHandle.queryPermission({ mode: 'readwrite' });
          if (perm !== 'granted') {
            await rootDirHandle.requestPermission({ mode: 'readwrite' });
          }
        }
      } catch(e) { console.log("Pas de dossier PC configuré."); }

      render();
      loadThumbs();
      const observer = new MutationObserver(() => loadThumbs());
      observer.observe(document.getElementById('view'), { childList: true });

  }
}

async function createFolderForProducer(name) {
  if (!rootDirHandle) return;
  try {
    const safeName = name.replace(/[^a-z0-9]/gi, '_');
    const dir = await rootDirHandle.getDirectoryHandle(safeName, { create: true });
    await dir.getDirectoryHandle('Documents', { create: true });
    await dir.getDirectoryHandle('Photos', { create: true });
  } catch(e) {
    console.error("Impossible de créer le dossier du producteur", e);
  }
}

async function saveFileToFolder(producerName, file) {
  if (!rootDirHandle) return;
  try {
    const safeName = producerName.replace(/[^a-z0-9]/gi, '_');
    const dir = await rootDirHandle.getDirectoryHandle(safeName, { create: true });
    let subDir = 'Documents';
    if (file.type.startsWith('image/')) subDir = 'Photos';
    const folder = await dir.getDirectoryHandle(subDir, { create: true });
    const fileHandle = await folder.getFileHandle(file.name, { create: true });
    const writable = await fileHandle.createWritable();
    await writable.write(file);
    await writable.close();
  } catch(e) {
    console.error("Impossible de copier le fichier sur le PC", e);
    toast("Impossible de copier le fichier sur le PC", true);
  }
}

/* =========================================================
   HEVEA — Stockage local
   ========================================================= */
const DB_KEY = 'hevea_data_v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmt = n => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0)) + ' F';
const fmtNum = n => new Intl.NumberFormat('fr-FR').format(Math.round(n || 0));
const fmtWeight = n => new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(Number(n) || 0);
const fmtDate = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const fmtSize = b => b < 1024 ? b + ' o' : b < 1048576 ? (b/1024).toFixed(0) + ' Ko' : (b/1048576).toFixed(1) + ' Mo';

let DATA = loadData();
let route = { view: 'dashboard', id: null };
let detailTab = 'apercu';
let fileTarget = null;
let reportStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0, 10);
let reportEnd = todayISO();

function loadData() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      data.producers = Array.isArray(data.producers) ? data.producers : [];
      data.loans = Array.isArray(data.loans) ? data.loans : [];
      data.purchases = Array.isArray(data.purchases) ? data.purchases : [];
      data.files = Array.isArray(data.files) ? data.files : [];
      data.deletedItems = Array.isArray(data.deletedItems) ? data.deletedItems : [];
      data.activityLog = Array.isArray(data.activityLog) ? data.activityLog : [];
      data.settings = data.settings || { currency: 'FCFA' };
      return data;
    }
  } catch (e) { console.warn('Lecture impossible', e); }
  return { producers: [], loans: [], purchases: [], files: [], deletedItems: [], activityLog: [], settings: { currency: 'FCFA' } };
}

function activitySnapshot(data) {
  return Object.fromEntries(['producers', 'loans', 'purchases', 'files'].map(key => [
    key,
    new Map((data[key] || []).map(item => [item.id, { serialized: JSON.stringify(item), item }]))
  ]));
}

let lastAuditSnapshot = activitySnapshot(DATA);

function activityLabel(collection, item) {
  if (collection === 'producers') return item.name || 'Producteur sans nom';
  if (collection === 'loans') return `Avance de ${(producerById(item.producerId) || {}).name || fmt(item.amount)}`;
  if (collection === 'purchases') return `Achat de ${(producerById(item.producerId) || {}).name || fmt(item.total)}`;
  return item.name || 'Document';
}

function saveData() {
  const currentSnapshot = activitySnapshot(DATA);
  const labels = { producers: 'Producteur', loans: 'Avance', purchases: 'Achat', files: 'Document' };
  const changes = [];
  for (const collection of Object.keys(currentSnapshot)) {
    const previous = lastAuditSnapshot[collection];
    const current = currentSnapshot[collection];
    for (const [id, value] of current) {
      if (!previous.has(id)) {
        const item = (DATA[collection] || []).find(entry => entry.id === id);
        changes.push({ action: 'Ajout', entity: labels[collection], label: activityLabel(collection, item) });
      } else if (previous.get(id).serialized !== value.serialized) {
        const item = (DATA[collection] || []).find(entry => entry.id === id);
        changes.push({ action: 'Modification', entity: labels[collection], label: activityLabel(collection, item) });
      }
    }
    for (const id of previous.keys()) {
      if (!current.has(id)) {
        const item = previous.get(id).item;
        changes.push({ action: 'Suppression ou mise en corbeille', entity: labels[collection], label: activityLabel(collection, item) });
      }
    }
  }
  if (changes.length) {
    DATA.activityLog = DATA.activityLog || [];
    DATA.activityLog.unshift(...changes.slice(0, 100).map(change => ({ id: uid(), date: new Date().toISOString(), ...change })));
    DATA.activityLog = DATA.activityLog.slice(0, 500);
  }
  try {
    localStorage.setItem(DB_KEY, JSON.stringify(DATA));
    lastAuditSnapshot = currentSnapshot;
  } catch (e) { toast('Stockage local saturé. Exportez vos données.', true); }
}

function recordActivity(action, entity, label) {
  DATA.activityLog = DATA.activityLog || [];
  DATA.activityLog.unshift({ id: uid(), date: new Date().toISOString(), action, entity, label });
  DATA.activityLog = DATA.activityLog.slice(0, 500);
}

const FileDB = {
  db: null,
  init() { return new Promise((res, rej) => { const req = indexedDB.open('hevea_files', 1); req.onupgradeneeded = e => { const db = e.target.result; if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'id' }); }; req.onsuccess = e => { this.db = e.target.result; res(); }; req.onerror = e => rej(e); }); },
  put(rec) { return new Promise((res, rej) => { const tx = this.db.transaction('files', 'readwrite'); tx.objectStore('files').put(rec); tx.oncomplete = () => res(rec.id); tx.onerror = e => rej(e); }); },
  get(id) { return new Promise((res, rej) => { const tx = this.db.transaction('files', 'readonly'); const r = tx.objectStore('files').get(id); r.onsuccess = () => res(r.result); r.onerror = e => rej(e); }); },
  del(id) { return new Promise((res, rej) => { const tx = this.db.transaction('files', 'readwrite'); tx.objectStore('files').delete(id); tx.oncomplete = () => res(); tx.onerror = e => rej(e); }); },
  all() { return new Promise((res, rej) => { const tx = this.db.transaction('files', 'readonly'); const r = tx.objectStore('files').getAll(); r.onsuccess = () => res(r.result || []); r.onerror = e => rej(e); }); }
};

function producerById(id) { return DATA.producers.find(p => p.id === id); }

function producerBalance(pid) {
  const loans = DATA.loans.filter(l => l.producerId === pid);
  const totalLoans = loans.reduce((s, l) => s + (l.amount || 0), 0);
  const totalRepaid = loans.reduce((s, l) => s + (l.repayments || []).reduce((a, r) => a + (r.amount || 0), 0), 0);
  const totalDeducted = DATA.purchases.filter(p => p.producerId === pid).reduce((s, p) => s + (p.deduction || 0), 0);
  return totalLoans - totalRepaid - totalDeducted;
}

function loanDeductedAmount(loan) {
  const producerLoans = DATA.loans.filter(l => l.producerId === loan.producerId).sort((a, b) => { const dateComp = (a.date || '').localeCompare(b.date || ''); return dateComp !== 0 ? dateComp : (a.id > b.id ? 1 : -1); });
  const totalDeducted = DATA.purchases.filter(p => p.producerId === loan.producerId).reduce((s, p) => s + (p.deduction || 0), 0);
  let remainingDeduction = totalDeducted, deductedForThisLoan = 0;
  for (const l of producerLoans) {
    const lRepaid = (l.repayments || []).reduce((a, r) => a + (r.amount || 0), 0);
    let lRem = (l.amount || 0) - lRepaid;
    if (lRem <= 0) continue;
    if (remainingDeduction > 0) {
      const applied = Math.min(remainingDeduction, lRem);
      remainingDeduction -= applied; lRem -= applied;
      if (l.id === loan.id) { deductedForThisLoan = applied; break; }
    } else { if (l.id === loan.id) break; }
  }
  return deductedForThisLoan;
}

function loanRemaining(loan) {
  const repaid = (loan.repayments || []).reduce((a, r) => a + (r.amount || 0), 0);
  return Math.max(0, (loan.amount || 0) - repaid - loanDeductedAmount(loan));
}

function filesFor(ownerId) { return DATA.files.filter(f => f.ownerId === ownerId); }

function avatarHTML(name, size = 48, photo = null) {
  const n = name || '?';
  const initials = n.trim().split(/\s+/).map(s => s[0]).slice(0, 2).join('').toUpperCase();
  const hue = [...n].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
  const style = `width:${size}px;height:${size}px;font-size:${size * 0.36}px;--h:${hue}`;
  if (photo) return `<div class="avatar" style="${style}"><img src="${photo}" alt=""></div>`;
  return `<div class="avatar" style="${style}">${esc(initials)}</div>`;
}

function toast(msg, isErr = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.textContent = msg;
  document.getElementById('toastWrap').appendChild(el);

}

// --- SVG CHART BUILDER ---
let dashboardChartYear = 2023;

function chartMonth(date) {
  const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
  const monthLabel = date.toLocaleDateString('fr-FR', { month: 'short' });
  return {
    key,
    label: date.getMonth() === 0 ? `${monthLabel} ${date.getFullYear()}` : monthLabel,
    total: DATA.purchases
      .filter(p => (p.date || '').startsWith(key))
      .reduce((sum, purchase) => sum + (purchase.total || 0), 0)
  };
}

function buildChart(months) {
  const width = Math.max(800, months.length * 66), height = 220, padding = 40;
  const max = Math.max(...months.map(m => m.total), 1);
  const stepX = (width - padding * 2) / (months.length - 1);
  const points = months.map((m, i) => {
    const x = padding + i * stepX;
    const y = height - padding - (m.total / max) * (height - padding * 2);
    return { x, y, ...m };
  });
  let lineD = `M ${points[0].x} ${points[0].y}`;
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i], p1 = points[i + 1];
    const cp1x = p0.x + (p1.x - p0.x) / 2, cp1y = p0.y;
    const cp2x = p0.x + (p1.x - p0.x) / 2, cp2y = p1.y;
    lineD += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p1.x} ${p1.y}`;
  }
  const areaD = `${lineD} L ${points[points.length - 1].x} ${height - padding} L ${points[0].x} ${height - padding} Z`;
  let gridLines = '';
  for(let i=0; i<=4; i++) {
    const y = padding + i * ((height - padding*2) / 4);
    gridLines += `<line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" class="chart-grid" />`;
  }
  let dots = '';
  points.forEach(p => {
    dots += `
      <g class="chart-group">
        <circle cx="${p.x}" cy="${p.y}" r="5" class="chart-dot" />
        <text x="${p.x}" y="${p.y - 14}" class="chart-value">${fmtNum(p.total)} F</text>
        <text x="${p.x}" y="${height - 10}" class="chart-label">${p.label}</text>
      </g>
    `;
  });
  return `
      <svg class="chart-svg" style="width:${width}px" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
        <defs>
          <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--p500)" stop-opacity="0.3"/>
            <stop offset="100%" stop-color="var(--p500)" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${gridLines}
        <path d="${areaD}" class="chart-area" />
        <path d="${lineD}" class="chart-line" />
        ${dots}
      </svg>
  `;
}

let chartDrag = null;
document.addEventListener('pointerdown', e => {
  const chart = e.target.closest('.chart-container');
  if (!chart || e.button !== 0) return;
  chartDrag = { chart, pointerId: e.pointerId, startX: e.clientX, scrollLeft: chart.scrollLeft };
  chart.setPointerCapture(e.pointerId);
  chart.classList.add('dragging');
  e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if (!chartDrag || chartDrag.pointerId !== e.pointerId) return;
  const chart = chartDrag.chart;
  chart.scrollLeft = chartDrag.scrollLeft - (e.clientX - chartDrag.startX);
});
function stopChartDrag(e) {
  if (!chartDrag || chartDrag.pointerId !== e.pointerId) return;
  chartDrag.chart.classList.remove('dragging');
  chartDrag = null;
}
document.addEventListener('pointerup', stopChartDrag);
document.addEventListener('pointercancel', stopChartDrag);

function viewReports() {
  const purchases = DATA.purchases
    .filter(p => (p.date || '') >= reportStart && (p.date || '') <= reportEnd)

  const loans = DATA.loans.filter(l => (l.date || '') >= reportStart && (l.date || '') <= reportEnd);
  const repayments = DATA.loans.flatMap(l => (l.repayments || []).map(r => ({ ...r, producerId: l.producerId })))
    .filter(r => (r.date || '') >= reportStart && (r.date || '') <= reportEnd);
  const gross = purchases.reduce((sum, p) => sum + (p.total || 0), 0);
  const deducted = purchases.reduce((sum, p) => sum + (p.deduction || 0), 0);
  const net = purchases.reduce((sum, p) => sum + (p.net || 0), 0);
  const weight = purchases.reduce((sum, p) => sum + (p.weight || 0), 0);
  const advanced = loans.reduce((sum, l) => sum + (l.amount || 0), 0);
  const refunded = repayments.reduce((sum, r) => sum + (r.amount || 0), 0);
  const perProducer = new Map();
  for (const purchase of purchases) {
    const name = (producerById(purchase.producerId) || {}).name || 'Producteur supprimé';
    const entry = perProducer.get(name) || { name, weight: 0, gross: 0, net: 0, count: 0 };
    entry.weight += purchase.weight || 0;
    entry.gross += purchase.total || 0;
    entry.net += purchase.net || 0;
    entry.count++;
    perProducer.set(name, entry);

  const leaders = [...perProducer.values()].sort((a, b) => b.weight - a.weight);

function fileTile(f) {
  const previewKind = filePreviewKind(f);
  const isImg = previewKind === 'image';
  const openAction = previewKind ? 'preview-file' : 'download-file';
  const ext = (f.name.split('.').pop() || '').toUpperCase().slice(0, 5);
  return `<div class="file-tile"><div class="file-acts"><button data-action="download-file" data-id="${f.id}" title="Télécharger"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--dark900)" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button><button data-action="delete-file" data-id="${f.id}" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="file-thumb" data-action="${openAction}" data-id="${f.id}" style="cursor:pointer" title="${previewKind ? 'Ouvrir dans le site' : 'Télécharger'}">${isImg ? `<img src="" data-lazy="${f.id}" alt="">` : `<div style="text-align:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg><div style="font-size:11px;font-weight:700;color:#94a3b8;margin-top:6px">${esc(ext)}</div></div>`}</div>
    <div class="file-info"><div class="fn" title="${esc(f.name)}">${esc(f.name)}</div><div class="fs">${fmtSize(f.size)} · ${fmtDate((f.date || '').slice(0, 10))}</div></div>
  </div>`;
}

function filePreviewKind(file) {
  const type = (file.type || '').toLowerCase();
  if (type.startsWith('image/')) return 'image';
  if (type === 'application/pdf') return 'pdf';
  const extension = (file.name.split('.').pop() || '').toLowerCase();
  if (extension === 'pdf') return 'pdf';
  if (['avif', 'bmp', 'gif', 'jpeg', 'jpg', 'png', 'svg', 'webp'].includes(extension)) return 'image';
  return null;
}

async function loadThumbs() {
  const imgs = document.querySelectorAll('img[data-lazy]');

function openModal({ title, body, submitLabel = 'Enregistrer', onSubmit, wide = false, onMount }) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="modal ${wide ? 'wide' : ''}">
    <div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" data-close>✕</button></div>
    <form class="modal-body" id="modalForm">${body}</form>
    <div class="modal-foot"><button type="button" class="btn ghost" data-close>Annuler</button><button type="submit" form="modalForm" class="btn primary">${esc(submitLabel)}</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  overlay.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  const form = overlay.querySelector('#modalForm');
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const fd = Object.fromEntries(new FormData(form).entries());
    const ok = await onSubmit(fd, form, close);
    if (ok !== false) close();
  });
  if (onMount) onMount(form);
  setTimeout(() => form.querySelector('input,select,textarea')?.focus(), 60);
  return { close, form };
}

function trashTypeLabel(type) {
  return ({ producer: 'Producteur', loan: 'Avance sur production', purchase: 'Achat', file: 'Document' })[type] || 'Élément';

function trashItemName(entry) {
  if (entry.type === 'producer') return entry.item.name || 'Producteur sans nom';
  if (entry.type === 'loan') {
    const producer = producerById(entry.item.producerId);
    return producer ? `Avance — ${producer.name}` : `Avance de ${fmt(entry.item.amount)}`;
  }
  if (entry.type === 'purchase') {
    const producer = producerById(entry.item.producerId);
    return producer ? `Achat — ${producer.name}` : `Achat de ${fmt(entry.item.total)}`;
  }
  return entry.item.name || 'Document sans nom';
}

function trashItemDetails(entry) {
  if (entry.type === 'producer') {
    const related = entry.related || {};
    return `${(related.loans || []).length} avance(s), ${(related.purchases || []).length} achat(s), ${(related.files || []).length} document(s) associés`;
  }
  if (entry.type === 'loan') return `${fmt(entry.item.amount)} · ${fmtDate(entry.item.date)}`;
  if (entry.type === 'purchase') return `${fmt(entry.item.total)} · ${fmtDate(entry.item.date)}`;
  return `${fmtSize(entry.item.size || 0)} · ${entry.item.ownerType === 'producer' ? 'Document producteur' : 'Document'}`;
}

async function restoreFromTrash(id) {
  if (!isAdminLoggedIn) { toast('Connectez-vous comme administrateur pour restaurer cet élément.', true); return; }
  const entry = (DATA.deletedItems || []).find(item => item.id === id);
  if (!entry) { toast('Élément introuvable dans la corbeille.', true); return; }

  if (entry.type === 'producer') {
    DATA.producers.push(entry.item);
    DATA.loans.push(...((entry.related && entry.related.loans) || []));
    DATA.purchases.push(...((entry.related && entry.related.purchases) || []));
    DATA.files.push(...((entry.related && entry.related.files) || []));
  } else if (entry.type === 'loan') {
    DATA.loans.push(entry.item);
  } else if (entry.type === 'purchase') {
    DATA.purchases.push(entry.item);
  } else if (entry.type === 'file') {
    let storedFile;
    try {
      storedFile = await FileDB.get(entry.item.id);
    } catch (error) {
      console.error('Impossible de vérifier le document à restaurer', error);
      toast('Impossible de vérifier le document à restaurer.', true);
      return;
    }
    if (!storedFile) { toast('Le contenu de ce document est introuvable ; il ne peut pas être restauré.', true); return; }
    DATA.files.push(entry.item);
  } else {
    toast('Type d’élément inconnu ; restauration impossible.', true); return;
  }

  DATA.deletedItems = DATA.deletedItems.filter(item => item.id !== id);
  recordActivity('Restauration', trashTypeLabel(entry.type), trashItemName(entry));
  saveData();
  render();
  toast('Élément restauré');
}

async function permanentlyDeleteFromTrash(id) {
  if (!isAdminLoggedIn) { toast('Connectez-vous comme administrateur pour supprimer définitivement.', true); return; }
  const entry = (DATA.deletedItems || []).find(item => item.id === id);
  if (!entry) { toast('Élément introuvable dans la corbeille.', true); return; }
  if (!confirm(`Supprimer définitivement ${trashTypeLabel(entry.type).toLowerCase()} « ${trashItemName(entry)} » ? Cette action est irréversible.`)) return;

  const files = entry.type === 'file'
    ? [entry.item]
    : entry.type === 'producer'
      ? ((entry.related && entry.related.files) || [])
      : [];
  try {
    for (const file of files) await FileDB.del(file.id);
  } catch (error) {
    console.error('Impossible de supprimer définitivement les documents', error);
    toast('La suppression définitive a échoué. Les éléments restent dans la corbeille.', true);
    return;
  }
  recordActivity('Suppression définitive', trashTypeLabel(entry.type), trashItemName(entry));
  DATA.deletedItems = DATA.deletedItems.filter(item => item.id !== id);
  saveData();
  render();
  toast('Élément supprimé définitivement');
}

function pickFiles(ownerId, ownerType) { fileTarget = { ownerId, ownerType }; document.getElementById('fileInput').click(); }

document.getElementById('fileInput').addEventListener('change', async e => {
  const files = [...e.target.files];
  if (!files.length || !fileTarget) return;
  toast(`Ajout de ${files.length} fichier(s)…`);

  const p = producerById(fileTarget.ownerId);

  for (const f of files) {
    const dataUrl = await readAsDataURL(f);
    const fid = uid();
    await FileDB.put({ id: fid, data: dataUrl });
    DATA.files.push({ id: fid, ownerId: fileTarget.ownerId, ownerType: fileTarget.ownerType, name: f.name, type: f.type || 'application/octet-stream', size: f.size, date: new Date().toISOString() });
    if (p) {
      await saveFileToFolder(p.name, f);
    }
  }
  saveData(); e.target.value = ''; toast('Fichier(s) ajouté(s)'); render();
});

function readAsDataURL(file) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function resizeImage(file, max = 260) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = rej; img.src = url;
  });
}

async function downloadFile(id) {
  const rec = await FileDB.get(id); const meta = DATA.files.find(f => f.id === id);
  if (!rec || !meta) { toast('Fichier introuvable', true); return; }
  const a = document.createElement('a'); a.href = rec.data; a.download = meta.name;
  document.body.appendChild(a); a.click(); a.remove();
}

async function previewFile(id) {
  const rec = await FileDB.get(id);
  const meta = DATA.files.find(f => f.id === id);
  if (!rec || !meta) { toast('Fichier introuvable', true); return; }

  const previewKind = filePreviewKind(meta);
  if (!previewKind) { toast('Aperçu non disponible pour ce type de fichier', true); return; }

  try {
    const sourceBlob = await (await fetch(rec.data)).blob();
    const blob = new Blob([sourceBlob], {
      type: previewKind === 'pdf' ? 'application/pdf' : (meta.type || sourceBlob.type)
    });
    const objectUrl = URL.createObjectURL(blob);
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.style.zIndex = '10005';
    overlay.innerHTML = `<div class="modal file-preview">
      <div class="modal-head" style="flex:none">
        <h3>${esc(meta.name)}</h3>
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn ghost sm" type="button" data-preview-download>Télécharger</button>
          <button class="icon-btn" type="button" data-preview-close aria-label="Fermer">✕</button>
        </div>
      </div>
      <div class="modal-body" style="padding:0;flex:1;overflow:hidden"></div>
    </div>`;

    const content = overlay.querySelector('.modal-body');
    if (previewKind === 'image') {
      const image = document.createElement('img');
      image.src = objectUrl;
      image.alt = meta.name;
      content.appendChild(image);
    } else {
      const frame = document.createElement('iframe');
      frame.src = objectUrl;
      frame.title = meta.name;
      content.appendChild(frame);
    }

    const onEscape = event => {
      if (event.key === 'Escape') close();
    };
    const close = () => {
      overlay.remove();
      URL.revokeObjectURL(objectUrl);
      document.removeEventListener('keydown', onEscape);
    };
    overlay.querySelector('[data-preview-close]').addEventListener('click', close);
    overlay.querySelector('[data-preview-download]').addEventListener('click', () => downloadFile(id));
    overlay.addEventListener('click', event => {
      if (event.target === overlay) close();
    });
    document.addEventListener('keydown', onEscape);
    document.body.appendChild(overlay);
  } catch (error) {
    toast('Impossible d’ouvrir ce fichier dans le site', true);
  }
}

async function exportFull() {
  try {
    toast('Préparation de la sauvegarde…');
    const files = await FileDB.all();
    const exportedAt = new Date().toISOString();
    const payload = { app: 'HEVEA', version: 1, exportedAt, data: DATA, files: files.filter(f => f.id !== 'rootDir') };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `hevea_sauvegarde_${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    localStorage.setItem('hevea_last_backup_at', exportedAt);
    toast('Sauvegarde téléchargée');
    if (route.view === 'settings') render();
  } catch (error) {
    console.error('Échec de la création de la sauvegarde', error);
    toast('Impossible de créer la sauvegarde. Vérifiez le stockage disponible.', true);
  }
}

document.getElementById('importInput').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  if (!confirm('Cette opération remplacera toutes les données actuelles. Continuer ?')) { e.target.value = ''; return; }
  try {
    const text = await f.text(); const payload = JSON.parse(text);
    if (!payload || payload.app !== 'HEVEA' || !payload.data ||
        !Array.isArray(payload.data.producers) || !Array.isArray(payload.data.loans) ||
        !Array.isArray(payload.data.purchases) || !Array.isArray(payload.data.files) ||
        (payload.files !== undefined && (!Array.isArray(payload.files) ||
          payload.files.some(rec => !rec || !rec.id || typeof rec.data !== 'string')))) {
      throw new Error('Le fichier ne contient pas une sauvegarde HEVEA valide.');
    }
    const incomingFiles = payload.files || [];
    const previousFiles = (await FileDB.all()).filter(rec => rec.id !== 'rootDir');
    try {
      for (const rec of previousFiles) await FileDB.del(rec.id);
      for (const rec of incomingFiles) await FileDB.put(rec);
    } catch (fileError) {
      for (const rec of incomingFiles) await FileDB.del(rec.id);
      for (const rec of previousFiles) await FileDB.put(rec);
      throw fileError;
    }
    DATA = payload.data;
    DATA.deletedItems = Array.isArray(DATA.deletedItems) ? DATA.deletedItems : [];
    DATA.activityLog = Array.isArray(DATA.activityLog) ? DATA.activityLog : [];
    DATA.settings = DATA.settings || { currency: 'FCFA' };
    DATA.files = DATA.files || [];
    saveData();
    toast('Sauvegarde restaurée avec succès'); navigate('dashboard');
  } catch (err) {
    console.error('Échec de la restauration de la sauvegarde', err);
    toast(err.message || 'Impossible de restaurer cette sauvegarde.', true);
  }
  e.target.value = '';
});

function exportCSV() {
  const rows = [['Date', 'Producteur', 'Poids (kg)', 'Prix/kg', 'Total', 'Déduction', 'Net payé']];
  [...DATA.purchases].sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(x => {
    const p = producerById(x.producerId); rows.push([x.date, p ? p.name : '', x.weight, x.price, x.total, x.deduction || 0, x.net]);
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `hevea_achats_${todayISO()}.csv`; a.click(); URL.revokeObjectURL(a.href); toast('Export CSV téléchargé');
}

function exportReportCSV() {
  const rows = [['Date', 'Producteur', 'Poids (kg)', 'Prix/kg', 'Total brut', 'Déduction', 'Net payé']];
  DATA.purchases
    .filter(p => (p.date || '') >= reportStart && (p.date || '') <= reportEnd)

    });
  const csv = rows.map(row => row.map(cell => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hevea_rapport_${reportStart}_${reportEnd}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Rapport CSV téléchargé');
}

async function clearFiles() {
  for (const file of DATA.files) addToTrash('file', file);
  DATA.files = [];
  saveData(); render(); toast('Documents déplacés dans la corbeille');
}
async function clearAll() {
  for (const producer of DATA.producers) {
    const related = {
      loans: DATA.loans.filter(loan => loan.producerId === producer.id),
      purchases: DATA.purchases.filter(purchase => purchase.producerId === producer.id),
      files: DATA.files.filter(file => file.ownerId === producer.id)
    };
    addToTrash('producer', producer, related);
  }
  const producerIds = new Set(DATA.producers.map(producer => producer.id));
  for (const loan of DATA.loans) {
    if (!producerIds.has(loan.producerId)) addToTrash('loan', loan);
  }
  for (const purchase of DATA.purchases) {
    if (!producerIds.has(purchase.producerId)) addToTrash('purchase', purchase);
  }
  for (const file of DATA.files) {
    if (!producerIds.has(file.ownerId)) addToTrash('file', file);
  }
  DATA.producers = [];
  DATA.loans = [];
  DATA.purchases = [];
  DATA.files = [];
  saveData(); navigate('dashboard'); toast('Éléments déplacés dans la corbeille');
}
